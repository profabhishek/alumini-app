<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com
    DocumentRoot /var/www/alumni-portal/public

    <Directory /var/www/alumni-portal/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Increase limits for bulk CSV upload (20 MB file, 5 min timeout)
    LimitRequestBody 20971520
    TimeOut 300

    ErrorLog ${APACHE_LOG_DIR}/alumni-portal-error.log
    CustomLog ${APACHE_LOG_DIR}/alumni-portal-access.log combined
</VirtualHost>

